[build-system]
requires = ["setuptools>=68", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "reserve-pay-block-optimizer"
version = "0.5.0"
description = "Distribution-aware reserve block optimization for India mobility payments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["scikit-learn>=1.4,<2"]

[project.scripts]
reserve-pay-optimizer = "reserve_pay_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
