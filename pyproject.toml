[build-system]
requires = ["setuptools>=68", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "reserve-pay-block-optimizer"
version = "0.3.0"
description = "Deterministic India mobility simulation and reserve baseline evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
reserve-pay-optimizer = "reserve_pay_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
